# Documentations externes (ex. API Qonto) non joignables depuis l'environnement de travail : téléchargées ici, sur
# une branche de travail (jamais sur main), dans tools/docs-externes/out/, puis lues et supprimées.
name: Docs externes

on:
  push:
    branches-ignore: [main]
    paths:
      - 'tools/docs-externes/urls.json'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/docs-externes/fetch.mjs
      - name: Commit du résultat sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/docs-externes/out
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Docs externes : téléchargement"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
